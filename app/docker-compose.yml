services:
  med:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "${MED_PORT:-8002}:8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - med
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
